helm:
  chart: nginx-chart

targetCustomizations:
  - name: hq
    clusterSelector:
      matchLabels:
        name: local
    helm:
      values:
        location: HQ
        port: 8080

  - name: za
    clusterSelector:
      matchLabels:
        location: za
    helm:
      values:
        location: 'South Africa'
        port: 8081


  - name: australia
    clusterSelector:
      matchLabels:
        location: aus
    helm:
      values:
        location: 'Australia'
        port: 8082

